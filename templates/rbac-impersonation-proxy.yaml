apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-impersonation-proxy
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - users
      - groups
      - serviceaccounts
    verbs:
      - impersonate
  - apiGroups:
      - authentication.k8s.io
    resources:
      - '*'
    verbs:
      - impersonate
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-impersonation-proxy
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pinniped-concierge.serviceAccountName.impersonationProxy" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "pinniped-concierge.fullname" . }}-impersonation-proxy
  apiGroup: rbac.authorization.k8s.io
