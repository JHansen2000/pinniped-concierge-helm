apiVersion: v1
kind: Service
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
  annotations:
    kapp.k14s.io/disable-default-label-scoping-rules: ""
    {{- with .Values.service.api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "pinniped-concierge.deploymentSelectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 443
      targetPort: 10250
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
  annotations:
    kapp.k14s.io/disable-default-label-scoping-rules: ""
    {{- with .Values.service.proxy.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.proxy.type }}
  selector:
    {{- include "pinniped-concierge.deploymentSelectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 443
      targetPort: 8444
