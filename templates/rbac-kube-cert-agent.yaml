apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-kube-cert-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - policy
    resources:
      - podsecuritypolicies
    verbs:
      - use
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "pinniped-concierge.fullname" . }}-kube-cert-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pinniped-concierge.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pinniped-concierge.serviceAccountName.kubeCertAgent" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "pinniped-concierge.fullname" . }}-kube-cert-agent
  apiGroup: rbac.authorization.k8s.io
